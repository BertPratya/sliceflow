# Runs the checks on Linux, macOS, and Windows, on every push and pull
# request. The human works on Linux only, so this is where code for the
# other two systems (e.g. the file lock) is tested.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Run all three systems to the end, even when one fails, so one
      # run shows every system that is broken.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # By default, git on Windows turns "\n" into "\r\n" when it checks
      # files out. Turn that off, so the files are the same as in the
      # repo on every system.
      - name: Keep line endings as they are in the repo
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
